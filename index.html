<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash Prototype</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #888;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        font-size: 12px;
        line-height: 1.5;
        pointer-events: none;
        user-select: none;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">WASD — move &nbsp; SHIFT — walk &nbsp; X — dash</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
