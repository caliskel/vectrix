<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash · Tutorial</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0e1a;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #cbd5e1;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #back {
        position: fixed;
        top: 16px;
        left: 20px;
        font-size: 13px;
        text-decoration: none;
        color: #94a3b8;
        opacity: 0.7;
        transition: opacity 0.15s, color 0.15s;
        z-index: 10;
      }
      #back:hover {
        opacity: 1;
        color: #d8b4fe;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <a id="back" href="/">← Back to menu</a>
    <script type="module" src="/src/tutorial/main.ts"></script>
  </body>
</html>
